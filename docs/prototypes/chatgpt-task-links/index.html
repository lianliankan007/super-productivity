<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="color-scheme"
      content="light"
    />
    <meta
      name="referrer"
      content="no-referrer"
    />
    <link
      rel="icon"
      href="data:,"
    />
    <title>任务与对话 · 双边交互 Demo</title>
    <style>
      :root {
        --bg: #edf1f7;
        --paper: #fff;
        --ink: #18202b;
        --muted: #637083;
        --line: #e4e9f0;
        --soft: #f6f8fb;
        --blue: #315bf2;
        --blue-soft: #edf1ff;
        --green: #087c65;
        --green-soft: #eaf6f1;
        --red: #b43e3e;
        --gold: #775f24;
        --shadow: 0 16px 44px #263b5d0d;
        --overlay: #18202b55;
        --s: 8px;
        --s2: 16px;
        --s3: 24px;
        --s4: 32px;
        --r: 12px;
        --small: 12px;
        --body: 14px;
        --large: 18px;
        --display: 28px;
        --fast: 160ms;
        --modal-z: 20;
        --toast-z: 30;
        font-family: 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC', sans-serif;
        color: var(--ink);
        background: var(--bg);
        font-size: var(--body);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      a {
        color: inherit;
      }
      button,
      a,
      input,
      select,
      textarea,
      [tabindex]:focus {
        outline-offset: 4px;
      }
      :focus-visible {
        outline: 3px solid var(--blue);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: var(--large);
        letter-spacing: -0.5px;
      }
      h2 {
        font-size: 22px;
        letter-spacing: -0.5px;
        line-height: 1.4;
      }
      h3 {
        font-size: var(--body);
      }
      .icon {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        vertical-align: middle;
      }
      .icon.sm {
        width: 15px;
        height: 15px;
      }
      .header {
        min-height: 74px;
        padding: var(--s2) var(--s4);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s2);
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: var(--ink);
        color: var(--paper);
      }
      .brand p {
        font-size: var(--small);
        color: var(--muted);
        margin-top: 3px;
      }
      .actions,
      .row {
        display: flex;
        align-items: center;
        gap: var(--s);
      }
      .wrap {
        flex-wrap: wrap;
      }
      .space {
        justify-content: space-between;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: var(--small);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: 6px;
        font-size: var(--small);
        line-height: 1.3;
        background: var(--soft);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.green {
        background: var(--green-soft);
        color: var(--green);
      }
      .pill.blue {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .btn {
        border: 1px solid var(--line);
        border-radius: var(--s);
        background: var(--paper);
        color: var(--ink);
        padding: 8px 12px;
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        text-decoration: none;
        line-height: 1.3;
      }
      .btn:hover {
        background: var(--soft);
      }
      .btn.primary {
        background: var(--blue);
        color: var(--paper);
        border-color: var(--blue);
      }
      .btn.primary:hover {
        filter: brightness(0.95);
      }
      .btn.chat-primary {
        background: var(--green);
        border-color: var(--green);
        color: var(--paper);
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
      }
      .btn.quiet:hover {
        background: var(--soft);
        color: var(--ink);
      }
      .btn.danger {
        color: var(--red);
      }
      .btn.compact {
        padding: 6px 9px;
        min-height: 30px;
        font-size: var(--small);
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        padding: 0;
        flex-shrink: 0;
      }
      .stage-bar {
        padding: 22px var(--s4) var(--s2);
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: var(--s2);
      }
      .stage-bar h2 {
        font-size: var(--display);
        font-weight: 650;
      }
      .stage-bar p {
        margin-top: 7px;
        color: var(--muted);
        line-height: 1.6;
      }
      .segmented {
        display: flex;
        padding: 4px;
        background: #dde4ef;
        border-radius: 10px;
        gap: 2px;
      }
      .segmented button {
        border: 0;
        background: transparent;
        padding: 8px 13px;
        border-radius: 7px;
        color: #4d5b6e;
        white-space: nowrap;
      }
      .segmented button[aria-pressed='true'] {
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 2px 5px #18202b0a;
      }
      .workspace {
        padding: 0 var(--s4);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr);
        align-items: stretch;
      }
      .app {
        min-width: 0;
        border: 1px solid #d7dfeb;
        border-radius: var(--r);
        background: var(--paper);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .app-bar {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--s2);
        border-bottom: 1px solid var(--line);
        gap: var(--s);
      }
      .app-name {
        font-weight: 650;
        display: flex;
        align-items: center;
        gap: var(--s);
        font-size: 13px;
      }
      .app-name .sp-logo {
        background: var(--blue);
        color: var(--paper);
        width: 23px;
        height: 23px;
        border-radius: 6px;
        display: grid;
        place-items: center;
      }
      .app-name .chat-logo {
        color: var(--green);
        display: grid;
        place-items: center;
      }
      .app-state {
        font-size: 11px;
        color: var(--muted);
      }
      .app-layout {
        display: grid;
        grid-template-columns: 132px minmax(0, 1fr);
        min-height: 696px;
      }
      .sidebar {
        padding: var(--s2) 10px;
        background: #f7f9fc;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .sidebar .caption {
        color: var(--muted);
        font-size: 11px;
        padding: 18px var(--s) 7px;
      }
      .sidebar .caption:first-child {
        padding-top: 4px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: var(--s);
        padding: 9px var(--s);
        border: 0;
        border-radius: 6px;
        background: transparent;
        text-align: left;
        color: var(--muted);
        font-size: var(--small);
        width: 100%;
        line-height: 1.5;
      }
      .nav-item:hover {
        background: #eaf0f8;
      }
      .nav-item.active {
        background: var(--blue-soft);
        color: var(--blue);
        font-weight: 600;
      }
      .chat-app .nav-item.active {
        background: var(--green-soft);
        color: var(--green);
      }
      .nav-item span:not(.dot) {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nav-item .count {
        margin-left: auto;
        font-size: 11px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding: var(--s2) var(--s) 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.8;
      }
      .mini-avatar {
        width: 23px;
        height: 23px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        background: #e4eaf3;
        color: #46536b;
        font-size: 10px;
        margin-right: 5px;
      }
      .surface {
        min-width: 0;
        padding: 22px;
        display: flex;
        flex-direction: column;
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: var(--s2);
        min-width: 0;
      }
      .crumb span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .crumb button {
        padding: 0;
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }
      .crumb button:hover {
        color: var(--green);
      }
      .task-heading {
        margin-bottom: 18px;
      }
      .task-heading p {
        margin-top: 7px;
        font-size: var(--small);
        line-height: 1.65;
        color: var(--muted);
      }
      .root-switch {
        display: block;
        width: 100%;
        border: 0;
        padding: 0 20px 0 0;
        color: var(--ink);
        font-size: 20px;
        font-weight: 650;
        background: transparent;
        text-overflow: ellipsis;
      }
      .task-metrics {
        display: flex;
        align-items: center;
        gap: var(--s);
        margin: var(--s2) 0 5px;
      }
      .progress {
        height: 4px;
        background: var(--line);
        border-radius: 4px;
        overflow: hidden;
        flex: 1;
      }
      .progress > i {
        display: block;
        height: 100%;
        background: var(--blue);
        transition: width var(--fast);
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: var(--s2);
        margin-bottom: var(--s);
      }
      .section-title h3 {
        font-size: var(--small);
        color: var(--muted);
        font-weight: 500;
      }
      .task-row {
        display: grid;
        grid-template-columns: 21px minmax(0, 1fr) 25px;
        gap: var(--s);
        align-items: center;
        padding: 12px var(--s);
        border-bottom: 1px solid var(--line);
        border-radius: 6px;
      }
      .task-row.selected {
        background: var(--blue-soft);
        border-bottom-color: transparent;
      }
      .task-row:hover {
        background: var(--soft);
      }
      .task-row.selected:hover {
        background: var(--blue-soft);
      }
      .task-check {
        width: 17px;
        height: 17px;
        margin: 0;
        accent-color: var(--blue);
        cursor: pointer;
      }
      .task-title {
        padding: 0;
        border: 0;
        background: transparent;
        text-align: left;
        min-width: 0;
        line-height: 1.6;
        color: var(--ink);
      }
      .task-title > span {
        display: block;
        overflow-wrap: anywhere;
      }
      .task-title .task-meta {
        color: var(--muted);
        font-size: 10px;
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 2px;
      }
      .done .task-label {
        text-decoration: line-through;
        color: var(--muted);
      }
      .task-row .jump {
        color: var(--blue);
        border: 0;
        background: transparent;
        padding: 4px;
        display: inline-grid;
        place-items: center;
      }
      .task-detail {
        margin-top: 22px;
        padding: var(--s2);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .detail-title {
        font-weight: 600;
        font-size: 13px;
        margin-top: 5px;
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .detail-note {
        font-size: var(--small);
        color: var(--muted);
        line-height: 1.8;
        margin-top: var(--s);
      }
      .context-link {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: var(--s);
        padding: 10px;
        text-decoration: none;
        margin-top: var(--s);
        min-width: 0;
      }
      .context-link:hover {
        border-color: #a7c9bf;
        background: var(--green-soft);
      }
      .context-icon {
        width: 30px;
        height: 30px;
        background: var(--green-soft);
        color: var(--green);
        border-radius: 7px;
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .context-text {
        min-width: 0;
        flex: 1;
      }
      .context-text strong {
        display: block;
        font-weight: 500;
        font-size: var(--small);
        overflow-wrap: anywhere;
      }
      .context-text small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-top: 3px;
      }
      .context-link > .icon {
        width: 15px;
        color: var(--muted);
      }
      .empty {
        border: 1px dashed #cad3df;
        padding: var(--s2);
        border-radius: var(--s);
        color: var(--muted);
        font-size: var(--small);
        line-height: 1.8;
        margin-top: var(--s);
      }
      .task-footer {
        margin-top: auto;
        padding-top: var(--s2);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 10px;
        color: var(--muted);
      }
      .bridge {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8394b1;
        position: relative;
      }
      .bridge span {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #e2e8f2;
      }
      .chat-app .sidebar {
        background: #f8faf9;
      }
      .chat-app .surface {
        padding: 18px 20px;
      }
      .chat-top {
        margin-bottom: var(--s2);
      }
      .chat-top h2 {
        font-size: var(--large);
        line-height: 1.5;
      }
      .chat-top .small {
        margin-top: 4px;
      }
      .chat-stream {
        flex: 1;
        min-width: 0;
      }
      .user-message {
        background: #eef2f1;
        border-radius: 13px 13px 3px 13px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.8;
        margin: var(--s2) 0 var(--s3) 30px;
      }
      .assistant-title {
        display: flex;
        align-items: center;
        gap: var(--s);
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .assistant-title .icon {
        color: var(--green);
      }
      .assistant-text {
        font-size: 13px;
        line-height: 1.9;
        color: #3c4a58;
      }
      .plugin-card {
        margin-top: 14px;
        border: 1px solid #cadfd8;
        border-radius: 10px;
        overflow: hidden;
      }
      .plugin-head {
        padding: 11px 13px;
        display: flex;
        align-items: center;
        gap: var(--s);
        background: #f3f9f6;
        border-bottom: 1px solid #dfece6;
        font-size: 11px;
        color: var(--green);
      }
      .plugin-head span:last-child {
        margin-left: auto;
      }
      .plugin-body {
        padding: 13px;
      }
      .target-label {
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 5px;
      }
      .target-select {
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 6px;
        width: 100%;
        padding: 8px;
        color: var(--ink);
        font-size: var(--small);
      }
      .draft-item {
        display: grid;
        grid-template-columns: 17px minmax(0, 1fr) 53px;
        align-items: center;
        gap: var(--s);
        margin-top: 12px;
      }
      .draft-item input[type='checkbox'] {
        accent-color: var(--green);
        margin: 0;
      }
      .draft-title {
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 6px 0;
        font-size: var(--small);
        color: var(--ink);
        background: transparent;
        min-width: 0;
      }
      .draft-time {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 5px;
        font-size: 11px;
        color: var(--muted);
      }
      .draft-info {
        display: flex;
        gap: 5px;
        align-items: start;
        margin: 13px 0;
        font-size: 10px;
        line-height: 1.7;
        color: var(--muted);
      }
      .draft-info .icon {
        margin-top: 1px;
      }
      .plugin-actions {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .plugin-task {
        display: flex;
        align-items: center;
        gap: var(--s);
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
        font-size: var(--small);
      }
      .plugin-task:last-child {
        border-bottom: 0;
      }
      .plugin-task > a {
        margin-left: auto;
        color: var(--blue);
        text-decoration: none;
        flex-shrink: 0;
      }
      .plugin-task > span {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .saved-mark {
        display: flex;
        gap: var(--s);
        align-items: center;
        color: var(--green);
        font-weight: 600;
        margin-bottom: var(--s);
        font-size: 13px;
      }
      .quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: var(--s2) 0 10px;
      }
      .quick-actions .btn {
        border-radius: 16px;
        font-size: 10px;
        min-height: 28px;
        padding: 6px 9px;
      }
      .composer {
        margin-top: auto;
        padding-top: var(--s2);
      }
      .composer-box {
        display: flex;
        gap: var(--s);
        align-items: end;
        border: 1px solid #d6e0dc;
        border-radius: 12px;
        padding: 10px;
        background: var(--paper);
      }
      .composer textarea {
        resize: none;
        border: 0;
        background: transparent;
        width: 100%;
        min-height: 42px;
        max-height: 100px;
        outline-offset: 1px;
        font-size: var(--small);
        line-height: 1.8;
        color: var(--ink);
      }
      .composer-note {
        font-size: 10px;
        color: var(--muted);
        text-align: center;
        margin-top: 7px;
      }
      .project-summary {
        padding: var(--s2);
        background: var(--green-soft);
        border-radius: 10px;
        margin: var(--s2) 0;
        line-height: 1.8;
      }
      .conversation-card {
        display: block;
        width: 100%;
        text-align: left;
        padding: 14px 0;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
      }
      .conversation-card:hover {
        color: var(--green);
      }
      .conversation-card strong {
        display: block;
        font-size: 13px;
        font-weight: 600;
      }
      .conversation-card small {
        color: var(--muted);
        font-size: 11px;
        display: block;
        margin-top: 5px;
        line-height: 1.7;
      }
      .project-task-link {
        display: flex;
        gap: 10px;
        align-items: center;
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: var(--s);
        margin-top: var(--s);
        padding: 10px;
      }
      .project-task-link:hover {
        background: var(--blue-soft);
        border-color: #becbf9;
      }
      .project-task-link .context-icon {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .caption-footer {
        padding: 15px var(--s4) 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--s2);
        font-size: 11px;
        color: var(--muted);
        line-height: 1.7;
      }
      .caption-footer details summary {
        cursor: pointer;
      }
      .caption-footer details p {
        max-width: 65ch;
        margin-top: var(--s);
      }
      .caption-footer > span {
        flex-shrink: 0;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--paper);
        padding: 12px 18px;
        border-radius: 10px;
        box-shadow: var(--shadow);
        z-index: var(--toast-z);
        max-width: min(90vw, 650px);
        font-size: 13px;
        line-height: 1.7;
      }
      .toast[hidden] {
        display: none;
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 0;
        width: min(520px, calc(100vw - 32px));

            if (!id) throw Error('请选择一条主任务。');
            updateData((d) => {
              const t = d.tasks.find((t) => t.id === id);
              if (!t.projects.includes(ui.projectId)) t.projects.push(ui.projectId);
            }, '项目与主任务已关联');
            ui.chatRootId = id;
            render();
            closeModal();
          },
        );
      }
      function manageLinks(id) {
        const task = getTask(id);
        const links = [
          ...task.projects.map((x) => ({
            kind: 'project',
            id: x,
            title: getProject(x)?.title,
          })),
          ...task.chats.map((x) => ({ kind: 'chat', id: x, title: getChat(x)?.title })),
        ];
        openModal(
          '管理关联',
          `<p class="small muted">选择要解除的关联。任务、项目和会话都会保留。</p>${links.map((l) => `<label class="choice"><input type="checkbox" name="remove" value="${l.kind}:${l.id}"><span><strong>${escapeHtml(l.title)}</strong><small>${l.kind === 'project' ? '项目' : '会话'}</small></span></label>`).join('')}`,
          '解除选中关联',
          () => {
            const selected = new FormData(document.querySelector('#dialog-form')).getAll(
              'remove',
            );
            if (!selected.length) throw Error('请选择至少一条关联。');
            updateData((d) => {
              const t = d.tasks.find((t) => t.id === id);
              selected.forEach((value) => {
                const [k, target] = value.split(':');
                const field = k === 'project' ? 'projects' : 'chats';
                t[field] = t[field].filter((x) => x !== target);
              });
            }, '已解除选中关联，任务和对话仍保留');
            closeModal();
          },
        );
      }
      function existingTask() {
        const candidates = linkedRoots(ui.projectId);
        openModal(
          '把当前会话关联到已有任务',
          `<p class="small muted">会话：${escapeHtml(getChat(ui.chatId).title)}</p>${
            candidates
              .flatMap((t) => [t, ...children(t.id)])
              .map(
                (t) =>
                  `<label class="choice"><input type="radio" name="task" value="${t.id}"><span><strong>${escapeHtml(t.title)}</strong><small>${t.parentId ? '子任务 / ' + escapeHtml(getTask(t.parentId).title) : '主任务'}${t.chats.includes(ui.chatId) ? ' · 已关联当前会话' : ''}</small></span></label>`,
              )
              .join('') || '<p class="notice">请先在项目首页关联一条主任务。</p>'
          }`,
          '保存关联',
          () => {
            const id = selectedForm('task');
            if (!id) throw Error('请选择已有任务。');
            const already = getTask(id).chats.includes(ui.chatId);
            updateData(
              (d) => {
                const t = d.tasks.find((t) => t.id === id);
                if (!t.chats.includes(ui.chatId)) t.chats.push(ui.chatId);
              },
              already ? '此会话已关联，未重复添加' : '会话已关联到已有任务',
            );
            closeModal();
          },
        );
      }
      function newTask(isRoot = false) {
        const root = currentRoot();
        openModal(
          isRoot ? '新建主任务' : '添加子任务',
          `<label class="field"><span>任务名称</span><input name="title" maxlength="160" required placeholder="这件事需要做什么？"></label>${isRoot ? '<label class="field"><span>所属项目</span><select name="group"><option>工作</option><option>个人</option></select></label>' : `<p class="notice">将添加到「${escapeHtml(root.title)}」下面。后续可以单独关联会话。</p>`}`,
          '创建任务',
          () => {
            const title = String(selectedForm('title') || '').trim();
            if (!title) throw Error('请输入任务名称。');
            const task = {
              id: uid(),
              title,
              parentId: isRoot ? null : root.id,
              done: false,
              projects: [],
              chats: [],
              note: '',
              ...(isRoot ? { group: selectedForm('group') } : {}),
            };
            ui.taskId = task.id;
            if (isRoot) {
              ui.rootId = task.id;
              ui.nav = task.group;
            }
            updateData(
              (d) => d.tasks.push(task),
              isRoot ? '主任务已创建' : '子任务已创建',
            );
            closeModal();
          },
        );
      }
      function completeTask(id, done, fromChat = false) {
        const task = getTask(id);
        if (!task) return;
        const execute = () =>
          updateData(
            (d) => {
              const t = d.tasks.find((t) => t.id === id);
              if (t) t.done = done;
            },
            `${task.title}：${done ? '已完成' : '已恢复为待办'}`,
          );
        if (!fromChat) {
          execute();
          return;
        }
        // 对话端明确预览写入目标，演示插件不会根据讨论结束自动完成任务。
        openModal(
          '确认更新任务状态',
          `<p style="line-height:1.9">将「<strong>${escapeHtml(task.title)}</strong>」${done ? '标记为完成' : '恢复为待办'}。</p><p class="notice">只更新这一条任务。其他任务与会话不受影响。</p>`,
          done ? '标记完成' : '恢复为待办',
          () => {
            execute();
            closeModal();
          },
        );
      }
      function applyDraft() {
        const draft = ui.draft;
        if (!draft) return;
        if (data.appliedDrafts[draft.id]) {
          toast('这组子任务已经创建，不会重复添加');
          render();
          return;
        }
        const root = getTask(ui.chatRootId);
        if (!root || !root.projects.includes(ui.projectId)) {
          toast('请先选择当前项目下的主任务');
          return;
        }
        if (root.done) {
          toast('主任务已经完成，请先恢复为待办或选择其他主任务');
          return;
        }
        const picked = draft.items.filter((t) => t.checked);
        if (!picked.length) {
          toast('请至少选择一条子任务');
          return;
        }
        if (
          picked.some(
            (t) =>
              !t.title.trim() ||
              !Number.isInteger(Number(t.minutes)) ||
              t.minutes < 1 ||
              t.minutes > 10080,
          )
        ) {
          toast('请填写任务标题，估时为 1～10080 的整数分钟');
          return;
        }
        const ids = picked.map(() => uid());
        updateData((d) => {
          if (d.appliedDrafts[draft.id]) return;
          const parent = d.tasks.find((t) => t.id === root.id);
          if (!parent || parent.done) throw Error('主任务状态已经变化，请重新选择。');
          picked.forEach((item, i) =>
            d.tasks.push({
              id: ids[i],
              title: item.title.trim(),
              parentId: root.id,
              done: false,
              projects: [],
              chats: [ui.chatId],
              minutes: Number(item.minutes),
              note: '',
            }),
          );
          d.appliedDrafts[draft.id] = ids;
        }, `已创建 ${picked.length} 条子任务，并关联当前会话`);
      }
      function freshDraft(titles) {
        ui.draft = {
          id: uid(),
          chatId: ui.chatId,
          items: (titles || getChat(ui.chatId).draft)
            .slice(0, 10)
            .map((title, i) => ({ title, minutes: i ? 60 : 30, checked: true })),
        };
        ui.card = 'draft';
        ui.response = '先核对目标主任务和子任务内容，确认后再创建。';
        render();
      }
      function sendPrompt(text) {
        text = text.trim();
        if (!text) return;
        ui.lastPrompt = { chatId: ui.chatId, text };
        if (/查看|进度|哪些任务|任务列表/.test(text)) {
          ui.card = 'tasks';
          ui.response =
            '下面是选定主任务的当前进度。可以打开具体任务，或明确更新它的状态。';
          render();
          return;
        }
        if (/完成|恢复|待办/.test(text) && !/[\n；;]/.test(text)) {
          ui.card = 'tasks';
          ui.response = '请在任务列表中选择要更新的确切任务，再确认状态变更。';
          render();
          return;
        }
        if (/关联.*已有/.test(text)) {
          existingTask();
          return;
        }
        const titles = text
          .split(/[\n；;]/)
          .map((t) => t.replace(/^\s*(?:[-*•]|\d+[.、)])\s*/, '').trim())
          .filter(Boolean);
        if (titles.length > 1) {
          freshDraft(titles);
          return;
        }
        if (/拆|子任务|整理|创建|任务/.test(text)) {
          freshDraft();
          return;
        }
        ui.response =
          '这是本地演示。可以用“查看关联任务”，或每行输入一项待办来生成可编辑草稿；也可以使用下面的快捷操作。';
        render();
      }
      async function copyEntry(id) {
        const url = taskUrl(id);
        try {
          if (!navigator.clipboard) throw Error();
          await navigator.clipboard.writeText(url);
          toast('已复制演示任务入口，可在另一个标签页打开');
        } catch {
          openModal(
            '复制任务入口',
            `<label class="field"><span>复制此演示地址</span><input value="${escapeHtml(url)}" readonly onclick="this.select()"></label><p class="notice">这是本地原型地址，不是真实 Super Productivity 深链接。</p>`,
          );
        }
      }
      document.addEventListener('click', (event) => {
        const view = event.target.closest('.segmented button');
        if (view) {
          ui.view = view.dataset.view;
          const url = new URL(location.href);
          url.searchParams.set('surface', ui.view);
          history.pushState({}, '', url);
          render();
          return;
        }
        const jump = event.target.closest('[data-jump]');
        if (jump) {
          if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          const { jump: kind, id } = jump.dataset;
          if (kind === 'task') jumpTask(id);
          else if (kind === 'project') jumpProject(id);
          else jumpChat(id);
          return;
        }
        const button = event.target.closest('[data-action]');
        if (!button) return;
        const { action, id } = button.dataset;
        if (action === 'guide') showGuide();
        else if (action === 'close-modal') closeModal();
        else if (action === 'reset')
          openModal(
            '重置演示数据',
            `<p style="line-height:1.9">清除在此原型中新增的任务、关联和进度，恢复初始示例。</p><p class="notice">只影响这个浏览器里的演示数据，不会操作真实账号。</p>`,
            '重置演示',
            () => {
              data = initialData();
              try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
              } catch {}
              ui = {
                rootId: 't1',
                taskId: 't3',
                projectId: 'p1',
                chatId: 'c2',
                view: ui.view,
                card: 'draft',
                draft: null,
                nav: '工作',
                chatRootId: 't1',
              };
              history.replaceState({}, '', location.pathname + location.search);
              render();
              closeModal();
              toast('已恢复初始演示数据');
            },
          );
        else if (action === 'filter') {
          ui.nav = button.dataset.filter;
          const available = roots().filter(
            (t) => ui.nav === '全部' || t.group === ui.nav,
          );
          if (!available.some((t) => t.id === ui.rootId)) {
            ui.rootId = available[0].id;
            ui.taskId = ui.rootId;
          }
          render();
        } else if (action === 'select-root') jumpTask(id);
        else if (action === 'select-task') jumpTask(id);
        else if (action === 'project') {
          ui.response = null;
          jumpProject(id);
        } else if (action === 'conversation') {
          ui.response = null;
          jumpChat(id);
        } else if (action === 'bind') bindTask(id);
        else if (action === 'unlink') manageLinks(id);
        else if (action === 'bind-root-from-chat') bindRootFromChat();
        else if (action === 'new-root') newTask(true);
        else if (action === 'new-child') newTask();
        else if (action === 'existing') existingTask();
        else if (action === 'apply-draft') applyDraft();
        else if (action === 'new-draft') freshDraft();
        else if (action === 'tasks') {
          ui.card = 'tasks';
          ui.response = '这是当前主任务的进度。任务端的变更也会在这里体现。';
          render();
        } else if (action === 'copy-task') copyEntry(id);
      });
      document.addEventListener('change', (event) => {
        const el = event.target;
        if (el.dataset.complete) completeTask(el.dataset.complete, el.checked);
        else if (el.dataset.chatComplete)
          completeTask(el.dataset.chatComplete, el.checked, true);
        else if (el.id === 'root-switch') jumpTask(el.value);
        else if (el.id === 'chat-root') {
          ui.chatRootId = el.value;
          render();
        } else if (el.id === 'bind-kind')
          document.querySelector('#bind-options').innerHTML = bindOptions(
            el.value,
            getTask(bindingTaskId),
          );
        else if (el.dataset.draftCheck !== undefined) {
          ui.draft.items[+el.dataset.draftCheck].checked = el.checked;
          saveUI();
        }
      });
      document.addEventListener('input', (event) => {
        const el = event.target;
        if (el.dataset.draftTitle !== undefined) {
          ui.draft.items[+el.dataset.draftTitle].title = el.value;
          saveUI();
        }
        if (el.dataset.draftTime !== undefined) {
          ui.draft.items[+el.dataset.draftTime].minutes = Number(el.value);
          saveUI();
        }
      });
      document.addEventListener('submit', (event) => {
        if (event.target.id === 'dialog-form') {
          event.preventDefault();
          try {
            modalAction?.();
          } catch (error) {
            document.querySelector('#dialog-error').textContent = error.message;
          }
          return;
        }
        if (event.target.id === 'composer') {
          event.preventDefault();
          sendPrompt(document.querySelector('#prompt').value);
        }
      });
      document.addEventListener('keydown', (event) => {
        if (
          event.target.id === 'prompt' &&
          event.key === 'Enter' &&
          !event.shiftKey &&
          !event.isComposing
        ) {
          event.preventDefault();
          sendPrompt(event.target.value);
        }
      });
      window.addEventListener('popstate', useRoute);
      window.addEventListener('hashchange', useRoute);
      window.addEventListener('storage', (event) => {
        if (event.key === STORAGE_KEY) {
          data = readData();
          render();
          toast('已收到另一窗口的演示更新');
        }
      });
      useRoute();
    </script>
  </body>
</html>
